name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd ~/Tecolab
          git pull

      - name: Rebuild and restart container
        run: |
          cd ~/Tecolab
          docker stop tecolab-container || true
          docker rm tecolab-container || true
          docker build -t tecolab-app .
          docker run -d --name tecolab-container --env-file .env -p 8000:8000 --restart unless-stopped tecolab-app

      - name: Verify container started
        run: |
          sleep 10
          docker logs tecolab-container
          curl -f http://localhost:8000/ || (echo "Health check failed" && exit 1)
      

